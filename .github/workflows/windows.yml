name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60   # commit list for the updater's "what changed"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-quick3d
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-serialport
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-SDL2

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCH_BUILD_NUMBER=${{ github.run_number }} -DCH_COMMIT=${{ github.sha }}

      - name: Build
        run: cmake --build build -j4

      - name: Unit tests
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Deploy (windeployqt + MinGW runtime)
        run: |
          mkdir -p dist
          cp build/CyberHandStudio.exe dist/
          cp third_party/waveshare/ControlCANFD.dll dist/
          windeployqt6 --release --no-translations --qmldir qml --dir dist dist/CyberHandStudio.exe
          # copy every non-Qt DLL the exe and plugins need from the UCRT64 prefix
          for pass in 1 2 3 4 5 6; do
            find dist -name '*.exe' -o -name '*.dll' | while read f; do
              ldd "$f" 2>/dev/null | awk '{print $3}' | grep -i '/ucrt64/bin/' || true
            done | sort -u > deps.txt
            added=0
            while read d; do
              b=$(basename "$d")
              if [ ! -f "dist/$b" ]; then cp "$d" dist/; added=1; fi
            done < deps.txt
            [ $added -eq 0 ] && break
          done
          # MSYS2 Qt looks for QML/plugins under share/qt6 unless told otherwise
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\nQml2Imports = qml\n' > dist/qt.conf
          cat dist/qt.conf
          ls dist/qml || true
          mkdir -p dist/examples dist/tools
          cp assets/examples/* dist/examples/
          cp tools/*.py dist/tools/
          mkdir -p dist/tools/cad dist/models
          cp tools/cad/*.py dist/tools/cad/
          cp -r assets/models/* dist/models/
          cp README.md dist/README.md
          cp assets/fonts/OFL.txt dist/FONT-LICENSE-OFL.txt
          ls dist | head -100
          du -sh dist

      - name: Smoke test (start app, screenshot, quit)
        run: |
          cd dist
          QT_FORCE_STDERR_LOGGING=1 timeout 60 ./CyberHandStudio.exe --config-dir ./_ci_cfg --screenshot ../smoke.png --screenshot-delay 6000 > ../smoke.log 2>&1
          echo "exit=$?" >> ../smoke.log
          rm -rf ./_ci_cfg
          cat ../smoke.log
          test -s ../smoke.png

      - name: Zip
        run: |
          cd dist
          zip -qr ../CyberHandStudio-win64.zip .
          cd ..
          ls -la CyberHandStudio-win64.zip

      - name: version.json (in-app updater)
        shell: bash
        run: |
          python tools/make_version_json.py --zip CyberHandStudio-win64.zip --build ${{ github.run_number }} \
            --commit "${GITHUB_SHA}" --out version.json --notes notes.md
          head -c 600 version.json; echo

      # an older copy of the app installs the new zip over itself and restarts (same path as the Update button)
      - name: Update test (install zip over a copy, restart)
        run: |
          rm -rf upd && mkdir upd && cp -r dist upd/app
          echo "old build" > upd/app/README.md
          ZIP="$(cygpath -w "$PWD/CyberHandStudio-win64.zip")"
          cd upd/app
          QT_FORCE_STDERR_LOGGING=1 ./CyberHandStudio.exe --install-update "$ZIP" > ../install.log 2>&1 || echo "exit=$?" >> ../install.log
          cat ../install.log
          for i in $(seq 1 120); do
            grep -q "starting the app" update.log 2>/dev/null && break
            sleep 1
          done
          cat update.log || true
          sleep 8
          /c/Windows/System32/tasklist.exe //FI "IMAGENAME eq CyberHandStudio.exe" > ../tasks.log 2>&1 || true
          cat ../tasks.log
          /c/Windows/System32/taskkill.exe //IM CyberHandStudio.exe //F || true
          grep -q "done (robocopy" update.log
          grep -q "CyberHandStudio.exe" ../tasks.log    # restarted
          test "$(md5sum < README.md)" = "$(md5sum < ../../dist/README.md)"   # files replaced
          echo "update test ok"

      - name: Publish smoke result to branch ci-smoke
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p /tmp/smoke && cp smoke.png smoke.log /tmp/smoke/ 2>/dev/null || true
          cp upd/install.log /tmp/smoke/update_install.log 2>/dev/null || true
          cp upd/app/update.log /tmp/smoke/update.log 2>/dev/null || true
          cp upd/tasks.log /tmp/smoke/update_tasks.log 2>/dev/null || true
          ls /tmp/smoke
          cd /tmp/smoke
          git init -q -b ci-smoke
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "${GITHUB_SHA}" > sha.txt
          git add -A && git commit -qm "smoke ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: CyberHandStudio-win64
          path: CyberHandStudio-win64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke.png
            smoke.log
          if-no-files-found: ignore

      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CyberHandStudio-win64.zip version.json \
            --prerelease --title "Latest build (main)" --notes-file notes.md

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" CyberHandStudio-win64.zip --title "${GITHUB_REF_NAME}" --notes "CyberHand Studio ${GITHUB_REF_NAME}"
